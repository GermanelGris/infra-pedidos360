# Entorno local completo (sin AWS): MySQL + RabbitMQ + catalog + orders + notify + report + audit + mq-admin + BFF.
# Solo MySQL y RabbitMQ (servicios desde el IDE):  docker compose up -d mysql rabbitmq
# Todo el backend:                                 docker compose up -d --build
# RabbitMQ Management UI:                          http://localhost:15672  (pedidos360 / pedidos360)
x-rabbit-node: &rabbit-node
  image: rabbitmq:4-management
  environment:
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-local}
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 12

services:
  mysql:
    image: mysql:8.4
    container_name: pedidos360-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Mensajería: clúster RabbitMQ de dos nodos ----------------
  # Iguales en ambos nodos: imagen, usuario/clave y RABBITMQ_ERLANG_COOKIE (secreto compartido para unirse).
  # Distintos: hostname (nombre de nodo), volumen de datos y puertos publicados.
  # Verificar:  docker compose exec rabbit1 rabbitmqctl cluster_status
  rabbit1:
    <<: *rabbit-node
    container_name: pedidos360-rabbit1
    hostname: rabbit1              # nombre de nodo: rabbit@rabbit1
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI

  rabbit2:
    <<: *rabbit-node
    container_name: pedidos360-rabbit2
    hostname: rabbit2              # nombre de nodo: rabbit@rabbit2
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      rabbit1:
        condition: service_healthy

  # Políticas de retención y limpieza (P11): se aplican una vez y el contenedor termina
  rabbit-policies:
    image: rabbitmq:4-management
    container_name: pedidos360-rabbit-policies
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-local}
    volumes:
      - ../rabbitmq/policies.sh:/policies.sh:ro
    entrypoint: ["sh", "/policies.sh"]
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
    restart: "no"

  catalog:
    build: ../../ms-pedidos360-catalog
    container_name: pedidos360-catalog
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  orders:
    build: ../../ms-pedidos360-orders
    container_name: pedidos360-orders
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      CATALOG_URL: http://catalog:8082
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      catalog:
        condition: service_started

  notify:
    build: ../../ms-pedidos360-notify
    container_name: pedidos360-notify
    environment:
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "8083:8083"
    depends_on:
      rabbit1:
        condition: service_healthy

  mq-admin:
    build: ../../ms-pedidos360-mq-admin
    container_name: pedidos360-mq-admin
    environment:
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "8086:8086"     # Swagger UI: http://localhost:8086/swagger-ui.html
    depends_on:
      rabbit1:
        condition: service_healthy

  bff:
    build: ../../ms-pedidos360-bff
    container_name: pedidos360-bff
    environment:
      TENANT_ID: ${TENANT_ID:-00000000-0000-0000-0000-000000000000}
      API_CLIENT_ID: ${API_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      API_SCOPE: ${API_SCOPE:-Pedidos.ReadWrite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      ORDERS_URL: http://orders:8081
      CATALOG_URL: http://catalog:8082
      MQ_ADMIN_URL: http://mq-admin:8086
      REPORT_URL: http://report:8084
      AUDIT_URL: http://audit:8085
    ports:
      - "${BFF_PORT:-8080}:8080"   # si el 8080 está ocupado:  BFF_PORT=18080 docker compose up -d
    depends_on:
      - orders
      - catalog
      - mq-admin
      - report
      - audit

  # Suscriptores de orders.events (topic): cada uno con su cola, reintentos y DLQ
  report:
    build: ../../ms-pedidos360-report
    container_name: pedidos360-report
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "8084:8084"     # Swagger UI: http://localhost:8084/swagger-ui.html
    depends_on:
      mysql:
        condition: service_healthy
      rabbit1:
        condition: service_healthy

  audit:
    build: ../../ms-pedidos360-audit
    container_name: pedidos360-audit
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "8085:8085"     # Swagger UI: http://localhost:8085/swagger-ui.html
    depends_on:
      mysql:
        condition: service_healthy
      rabbit1:
        condition: service_healthy

volumes:
  mysql-data:
  rabbit1-data:
  rabbit2-data:

