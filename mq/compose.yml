# ec2-mq: RabbitMQ con Management UI (http://<host>:15672)
# La topología (exchanges cmd.direct / cmd.topic / cmd.dead.dlx y las 6 colas) la declaran
# ms-pedidos360-notify y ms-pedidos360-orders al conectarse.
# Uso:  docker compose up -d
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: pedidos360-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rabbitmq-data:
