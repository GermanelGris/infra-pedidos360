# Clúster de dos nodos (P1, P2). Lo leen rabbit1 y rabbit2 al arrancar desde /etc/rabbitmq/conf.d/.
# Descubrimiento "classic_config": cada nodo conoce la lista fija de miembros y se une al que ya esté arriba.
# Para unirse, ambos nodos deben compartir la misma RABBITMQ_ERLANG_COOKIE.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
