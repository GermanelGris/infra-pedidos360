# Despliegue en EC2 (ec2-apps). La base de datos es Amazon RDS MySQL; RabbitMQ corre en esta misma EC2.
# Uso:  cp .env.example .env  &&  nano .env  &&  docker compose up -d --build
x-rabbit-node: &rabbit-node
  image: rabbitmq:4-management
  environment:
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped

services:
  bff:
    build: ../../ms-pedidos360-bff
    container_name: pedidos360-bff
    ports:
      - "8080:8080"          # único puerto público de la API: lo consume el API Gateway
    environment:
      TENANT_ID: ${TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      API_SCOPE: ${API_SCOPE:-Pedidos.ReadWrite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://germanelgris.github.io}   # solo el origin, sin /frontend-pedidos360/
      ORDERS_URL: http://orders:8081
      CATALOG_URL: http://catalog:8082
      MQ_ADMIN_URL: http://mq-admin:8086
      REPORT_URL: http://report:8084
      AUDIT_URL: http://audit:8085
    depends_on:
      - orders
      - catalog
      - mq-admin
      - report
      - audit
    restart: unless-stopped

  orders:
    build: ../../ms-pedidos360-orders
    container_name: pedidos360-orders
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CATALOG_URL: http://catalog:8082
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      catalog:
        condition: service_started
      rabbit1:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build: ../../ms-pedidos360-catalog
    container_name: pedidos360-catalog
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  # ---------------- Mensajería: clúster RabbitMQ de dos nodos ----------------
  # Iguales en ambos nodos: imagen, usuario/clave y RABBITMQ_ERLANG_COOKIE (secreto compartido para unirse).
  # Distintos: hostname (nombre de nodo), volumen de datos y puertos publicados.
  # Verificar:  docker compose exec rabbit1 rabbitmqctl cluster_status
  rabbit1:
    <<: *rabbit-node
    container_name: pedidos360-rabbit1
    hostname: rabbit1              # nombre de nodo: rabbit@rabbit1
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "15672:15672"        # Management UI de rabbit1: abrir en el Security Group solo para "Mi IP"

  rabbit2:
    <<: *rabbit-node
    container_name: pedidos360-rabbit2
    hostname: rabbit2              # nombre de nodo: rabbit@rabbit2
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    ports:
      - "15673:15672"        # Management UI de rabbit2
    depends_on:
      rabbit1:
        condition: service_healthy

  # Políticas de retención y limpieza (P11): se aplican una vez y el contenedor termina
  rabbit-policies:
    image: rabbitmq:4-management
    container_name: pedidos360-rabbit-policies
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - ../rabbitmq/policies.sh:/policies.sh:ro
    entrypoint: ["sh", "/policies.sh"]
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
    restart: "no"

  notify:
    build: ../../ms-pedidos360-notify
    container_name: pedidos360-notify
    environment:
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      rabbit1:
        condition: service_healthy
    restart: unless-stopped

  mq-admin:
    build: ../../ms-pedidos360-mq-admin
    container_name: pedidos360-mq-admin
    environment:
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      rabbit1:
        condition: service_healthy
    restart: unless-stopped

  # Suscriptores de orders.events (topic): cada uno con su cola, reintentos y DLQ
  report:
    build: ../../ms-pedidos360-report
    container_name: pedidos360-report
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      rabbit1:
        condition: service_healthy
    restart: unless-stopped

  audit:
    build: ../../ms-pedidos360-audit
    container_name: pedidos360-audit
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbit1
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672   # si cae un nodo, se reconecta al otro
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
    depends_on:
      rabbit1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbit1-data:
  rabbit2-data:
